services:
  - type: web
    name: foodbridge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FB_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: FB_ADMIN_PHONE
        sync: false
      - key: FB_ADMIN_PASSWORD
        sync: false
